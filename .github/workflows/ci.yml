name: Monorepo Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. C++ Vector Engine Job ─────────────────────────────────────
  cpp-engine:
    name: C++ Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CMake & Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure CMake (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: engine/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        working-directory: engine/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles"

      - name: Build All Targets
        working-directory: engine/cpp
        run: cmake --build build --config Release

      - name: Run CTest Suite (53 Tests)
        working-directory: engine/cpp
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run Benchmark Binary (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: engine/cpp
        run: ./build/benchmark

      - name: Run Benchmark Binary (Windows)
        if: runner.os == 'Windows'
        working-directory: engine/cpp
        run: .\build\benchmark.exe

      - name: Upload CTest Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}
          path: |
            engine/cpp/build/Testing/Temporary/LastTest.log
            engine/cpp/build/Testing/Temporary/LastTestsFailed.log

  # ── 2. Node.js REST API Job ──────────────────────────────────────
  node-api:
    name: Node.js API (Lint, Build, Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Build API TypeScript Code
        working-directory: apps/api
        run: npm run build

      - name: Run API Unit & Integration Tests (110 Tests)
        working-directory: apps/api
        run: npm run test

      - name: Upload API Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: apps/api/*.log

  # ── 3. React Frontend Job ────────────────────────────────────────
  react-web:
    name: React Frontend (Lint, Build, Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint Frontend Code
        working-directory: apps/web
        run: npm run lint

      - name: Build React Production Bundle
        working-directory: apps/web
        run: npm run build

      - name: Run Frontend Tests (27 Tests)
        working-directory: apps/web
        run: npm run test

      - name: Upload Web Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-logs
          path: apps/web/*.log

  # ── 4. Docker Build Validation ──────────────────────────────────
  docker-validation:
    name: Docker Container Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C++ Engine Docker Image
        run: docker build -t myownai-engine ./engine/cpp

      - name: Build Node API Docker Image
        run: docker build -t myownai-api ./apps/api

      - name: Build React Web Docker Image
        run: docker build -t myownai-web ./apps/web

  # ── 5. End-to-End System Integration Tests ──────────────────────
  e2e-integration:
    name: End-to-End System Test
    runs-on: ubuntu-latest
    needs: [cpp-engine, node-api]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run E2E System Integration Test
        working-directory: apps/api
        run: npx vitest run tests/integration.e2e.test.ts

      - name: Upload E2E Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: apps/api/*.log
